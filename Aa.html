<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خطة التعلّم الأسبوعية للصفوف الأولية</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#17324d;--mut:#5d7186;--pri:#1f4e79;--pri2:#2c6aa0;--bd:#b9c6d4;--soft:#e8f0f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1823;--card:#16222f;--tx:#e6eef6;--mut:#9db0c3;--pri:#3b7bb3;--pri2:#5a9bd0;--bd:#33475b;--soft:#1d2d3d}}
:root[data-theme="dark"]{--bg:#0f1823;--card:#16222f;--tx:#e6eef6;--mut:#9db0c3;--pri:#3b7bb3;--pri2:#5a9bd0;--bd:#33475b;--soft:#1d2d3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;font-size:15px}
.wrap{max-width:1150px;margin:auto;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:9px 14px;background:var(--pri);color:#fff;font-weight:500}
button.alt{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
button.del{background:transparent;color:#c0392b;border:1px solid #c0392b;padding:5px 10px;font-size:13px}
#st{margin-inline-start:auto;color:var(--mut);font-size:13px}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.gov{font-size:13px;line-height:1.7;font-weight:500}
.logo{text-align:center;color:var(--pri2);font-weight:700;font-size:20px}
h1{text-align:center;font-size:21px;margin:14px 0}
.info{display:grid;grid-template-columns:110px 1fr;border:1px solid var(--pri);margin-bottom:14px}
.info>div{padding:7px 10px;border-bottom:1px solid var(--bd)}
.info .l{background:var(--pri);color:#fff;font-weight:700;text-align:center}
.info>div:nth-last-child(-n+2){border-bottom:0}
.grades{display:flex;gap:22px;flex-wrap:wrap}.grades label{display:flex;gap:6px;align-items:center}
.grades input{width:18px;height:18px}
input[type=text],textarea{width:100%;font:inherit;color:var(--tx);background:transparent;border:0;padding:6px;resize:vertical;outline:0}
input[type=text]:focus,textarea:focus{background:var(--soft)}
.wk{margin-bottom:16px;border:1px solid var(--pri);border-radius:8px;overflow:hidden}
.wh{display:flex;justify-content:space-between;align-items:center;background:var(--pri);color:#fff;padding:6px 12px;font-weight:700}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
th{background:var(--soft);font-size:13px;padding:6px;border:1px solid var(--bd)}
td{border:1px solid var(--bd);padding:0;vertical-align:top}
td textarea{min-height:38px;height:38px}
.un{width:19%}
.sig{display:flex;justify-content:space-between;gap:20px;margin-top:18px;flex-wrap:wrap}
.sig label{display:flex;gap:8px;align-items:center;flex:1;min-width:240px;font-weight:700}
.sig input{border-bottom:1px dotted var(--bd)}
.pv{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;color:#000}.bar,button,#st{display:none!important}
 .wrap{padding:0;max-width:none}.sheet{border:0;padding:0}
 .wk{break-inside:avoid}.sc{overflow:visible}table{min-width:0}
 textarea{resize:none;overflow:hidden}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="bar">
  <button onclick="addWeek()">+ إضافة أسبوع</button>
  <button class="alt" onclick="window.print()">🖨️ طباعة / PDF</button>
  <button class="alt" onclick="exp('html')">📄 تصدير Word (HTML)</button>
  <button class="alt" onclick="exp('csv')">📊 تصدير Excel (CSV)</button>
  <button class="alt" onclick="exp('json')">💾 نسخة احتياطية</button>
  <button class="alt" onclick="document.getElementById('imp').click()">📥 استيراد</button>
  <button class="alt" onclick="clr()">🗑️ مسح الكل</button>
  <input type="file" id="imp" accept=".json" hidden>
  <span id="st">الحفظ تلقائي</span>
 </div>
 <div class="sheet" id="sheet">
  <div class="head">
   <div class="gov">المملكة العربية السعودية<br>وزارة التعليم<br>الإدارة العامة للتعليم بمنطقة عسير<br>الشؤون التعليمية - إدارة الطفولة المبكرة<br>قسم الصفوف الأولية</div>
   <div class="logo">وزارة التعليم<br><small>Ministry of Education</small></div>
  </div>
  <h1>خطة التعلُّم الأسبوعية للصفوف الأولية</h1>
  <div class="info">
   <div class="l">اسم المدرسة</div><div><input type="text" id="school"></div>
   <div class="l">الصف</div><div class="grades" id="grades"></div>
  </div>
  <div id="weeks"></div>
  <div class="sig">
   <label>اسم معلمة المادة: <input type="text" id="teacher"></label>
   <label>مديرة المدرسة: <input type="text" id="principal"></label>
  </div>
 </div>
</div>
<script>
const KEY='weekly_plan_v1',COLS=['day','subj','lesson','skills','hw'],ROWS=6,GR=['أول ابتدائي','ثاني ابتدائي','ثالث ابتدائي'];
const H=['اليوم / التاريخ','المادة','الدرس','المهارات المستهدفة','الواجب المنزلي'];
let S=load(),tm;
function blank(){return{rows:Array.from({length:ROWS},()=>COLS.map(()=>'')),un:''}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.weeks)return d}catch(e){}
 return{school:'',teacher:'',principal:'',grade:[],weeks:Array.from({length:5},blank)}}
function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));st('تم الحفظ ✓')}catch(e){st('تعذّر الحفظ، صدّري نسخة احتياطية')}},300)}
function st(t){document.getElementById('st').textContent=t}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 school.value=S.school;teacher.value=S.teacher;principal.value=S.principal;
 grades.innerHTML=GR.map((g,i)=>`<label><input type="checkbox" ${S.grade.includes(i)?'checked':''} onchange="tg(${i},this.checked)">${g}</label>`).join('');
 weeks.innerHTML=S.weeks.map((w,wi)=>`<div class="wk"><div class="wh"><span>الأسبوع ${wi+1}</span><button class="del" onclick="delWeek(${wi})">حذف</button></div><div class="sc"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join('')}<th class="un">المهارات غير المتحققة</th></tr></thead><tbody>${w.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td><textarea data-w="${wi}" data-r="${ri}" data-c="${ci}">${esc(c)}</textarea></td>`).join('')}${ri==0?`<td rowspan="${ROWS}" class="un"><textarea style="height:100%;min-height:240px" data-w="${wi}" data-u="1">${esc(w.un)}</textarea></td>`:''}</tr>`).join('')}</tbody></table></div><div style="padding:6px"><button class="alt" onclick="addRow(${wi})">+ سطر</button></div></div>`).join('');
}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.u)S.weeks[d.w].un=t.value;else if(d.r!==undefined)S.weeks[d.w].rows[d.r][d.c]=t.value;
 else if(['school','teacher','principal'].includes(t.id))S[t.id]=t.value;else return;
 st('جارٍ الحفظ...');save()});
function tg(i,v){S.grade=S.grade.filter(x=>x!==i);if(v)S.grade.push(i);save()}
function addWeek(){S.weeks.push(blank());save();render();scrollTo(0,document.body.scrollHeight)}
function delWeek(i){if(confirm('حذف هذا الأسبوع؟')){S.weeks.splice(i,1);save();render()}}
function addRow(i){S.weeks[i].rows.push(COLS.map(()=>''));save();render()}
function clr(){if(confirm('سيتم مسح جميع البيانات. هل أنتِ متأكدة؟')){S=load.call(0,localStorage.removeItem(KEY));S=load();render();save()}}
function table(){return S.weeks.map((w,i)=>`<h3>الأسبوع ${i+1}</h3><table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;width:100%"><tr style="background:#1f4e79;color:#fff">${H.map(h=>`<th>${h}</th>`).join('')}<th>المهارات غير المتحققة</th></tr>${w.rows.map((r,ri)=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,'<br>')}</td>`).join('')}${ri==0?`<td rowspan="${w.rows.length}">${esc(w.un).replace(/\n/g,'<br>')}</td>`:''}</tr>`).join('')}</table>`).join('')}
async function exp(type){
 let data,name,mime;
 if(type=='json'){data=JSON.stringify(S);name='الخطة-الأسبوعية.json';mime='application/json'}
 else if(type=='csv'){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const L=[['الأسبوع',...H,'المهارات غير المتحققة'].map(q).join(',')];
  S.weeks.forEach((w,i)=>w.rows.forEach((r,ri)=>L.push([i+1,...r,ri==0?w.un:''].map(q).join(','))));
  data='\ufeff'+L.join('\r\n');name='الخطة-الأسبوعية.csv';mime='text/csv'}
 else{const g=S.grade.map(i=>GR[i]).join('، ');
  data=`<html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>body{font-family:Arial}</style></head><body><p style="text-align:center">المملكة العربية السعودية - وزارة التعليم - الإدارة العامة للتعليم بمنطقة عسير<br>الشؤون التعليمية - إدارة الطفولة المبكرة - قسم الصفوف الأولية</p><h2 style="text-align:center">خطة التعلُّم الأسبوعية للصفوف الأولية</h2><p>اسم المدرسة: ${esc(S.school)} &nbsp; | &nbsp; الصف: ${esc(g)}</p>${table()}<p>اسم معلمة المادة: ${esc(S.teacher)} &nbsp;&nbsp;&nbsp; مديرة المدرسة: ${esc(S.principal)}</p></body></html>`;name='الخطة-الأسبوعية.html';mime='text/html'}
 try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data:new Blob([data],{type:mime+';charset=utf-8'})})}
 catch(e){if(e&&e.code=='declined')return;alert('التصدير غير متاح هنا. استخدمي زر «طباعة / PDF» أو افتحي الرابط في المتصفح.')}
}
imp.onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.weeks)throw 0;S=d;render();save()}catch(x){alert('ملف غير صالح')}})};
render();
</script>
</body>
</html>
